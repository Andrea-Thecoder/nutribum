  <ellipse cx="500" cy="330" rx="10" ry="16" fill="#fef3c7" transform="rotate(5 500 330)"/>
  <ellipse cx="580" cy="345" rx="10" ry="16" fill="#fef3c7" transform="rotate(20 580 345)"/>
  <ellipse cx="650" cy="380" rx="10" ry="16" fill="#fef3c7" transform="rotate(30 650 380)"/>
  <ellipse cx="360" cy="400" rx="10" ry="16" fill="#fef3c7" transform="rotate(-30 360 400)"/>

